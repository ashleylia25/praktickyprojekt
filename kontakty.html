<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakty</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="/styles/kontakty.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-light" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">RideShare</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor03"
                aria-controls="navbarColor03" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor03">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="aplikace.html">Naše aplikace</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="o-nas.html">O nás</a>
                    </li>
                    <li class="nav-item-active">
                        <a class="nav-link" href="kontakty.html">Kontakty
                            <span class="visually-hidden">(current)</span>
                        </a>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-sm-2" type="search" placeholder="Hledat" style="border-radius: 12px;">
                    <button class="btn btn-secondary my-2 my-sm-0" type="submit"
                        style="border-radius: 12px;">Hledat</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="content">
        <form class="organized-form">
            <div id="banner">
                <div class="banner-nadpis">
                    <h2 class="mb-4 text-center">Kontaktujte nás</h2>
                </div>
            </div>
            <fieldset class="form-section">
                <legend style="margin-top: 24px;">Kontaktní údaje</legend>
                <div class="row">
                    <div class="col-md-6">
                        <div class="input-box">
                            <label class="form-label">Jméno</label>
                            <input type="text" class="form-control" placeholder="Jan">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-box">
                            <label class="form-label">Příjmení</label>
                            <input type="text" class="form-control" placeholder="Novák">
                        </div>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <div class="input-box">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="jan.novak@email.cz">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-box">
                            <label class="form-label">Telefon</label>
                            <input type="text" class="form-control" placeholder="+420 123 456 789">
                        </div>
                    </div>
                </div>
            </fieldset>

            <!-- 2. Přihlašovací údaje -->
            <fieldset class="form-section">
                <legend>Přihlašovací údaje</legend>
                <div class="row">
                    <div class="col-md-6">
                        <div class="input-box">
                            <label class="form-label">Heslo</label>
                            <input type="password" class="form-control" placeholder="Zadejte heslo" autocomplete="off">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-box">
                            <label class="form-label">Potvrzení hesla</label>
                            <input type="password" class="form-control" placeholder="Znovu zadejte heslo"
                                autocomplete="off">
                        </div>
                    </div>
                </div>
            </fieldset>
            <div class="row mt-3">
                <div class="col-md-12">
                    <div class="input-box">
                        <label class="form-label">Vaše zpráva</label>
                        <textarea class="form-control" rows="4" placeholder="Napište zprávu..."></textarea>
                    </div>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-md-12">
                    <div class="input-box">
                        <label class="form-label">Příloha</label>
                        <input type="file" class="form-control">
                    </div>
                </div>
            </div>
            </fieldset>

            <!-- Odeslání -->
            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg mt-3">Odeslat formulář</button>
            </div>

        </form>
    </div>



</body>

</html>
